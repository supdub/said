name: Build macOS DMG

"on":
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Restore build downloads
        uses: actions/cache@v5
        with:
          path: |
            build-macos/model-cache
            build-macos/_deps
          key: said-macos-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'scripts/build-macos.sh') }}

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" ]]; then
            echo "No signing certificate configured; the build will be ad-hoc signed."
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/said-signing.p12"
          keychain_path="$RUNNER_TEMP/said-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode >"$certificate_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Build universal DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build-macos.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SAID-macOS-DMG
          path: |
            dist/SAID-macos-*.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

      - name: Attach artifacts to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          project_version=$(sed -nE 's/^project\(SAID VERSION ([^ ]+) LANGUAGES.*$/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF_NAME" != "v$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$project_version." >&2
            exit 1
          fi
          release_title="SAID $project_version"
          release_flags=()
          if [[ -z "$APPLE_SIGNING_IDENTITY" || -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" ]]; then
            release_title="SAID $project_version macOS preview"
            release_flags+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/SAID-macos-*.dmg dist/SHA256SUMS-macos.txt --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "$release_title" "${release_flags[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/SAID-macos-*.dmg \
              dist/SHA256SUMS-macos.txt \
              --title "$release_title" \
              --notes-file "docs/RELEASE_NOTES_MACOS_$project_version.md" \
              "${release_flags[@]}"
          fi
