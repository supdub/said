<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SAID approved brand direction</title>
  <desc id="desc">The approved monochrome SAID identity, setup surface, overlay, and dots-to-caret mark.</desc>
  <style>
    :root {
      /* Render-safe sRGB fallbacks; production source tokens are specified in OKLCH. */
      --ink: #151613;
      --ink-raised: #242522;
      --paper: #f5f2e9;
      --paper-dim: #c5c3ba;
      --line-dark: #454641;
      --line-light: #d1cec5;
      --ink-oklch: oklch(0.145 0.008 100);
      --paper-oklch: oklch(0.955 0.017 100);
    }
    text { font-family: 'Geologica', 'Segoe UI', sans-serif; fill: #F5F2E9; }
    .label { font-size: 18px; font-weight: 650; letter-spacing: 0.16em; }
    .micro { font-size: 15px; font-weight: 580; letter-spacing: 0.12em; }
    .body { font-size: 24px; font-weight: 430; }
    .body-small { font-size: 19px; font-weight: 430; }
    .muted { fill: #C5C3BA; }
    .ink { fill: #151613; }
    .paper { fill: #F5F2E9; }
    .mark { fill: #F5F2E9; }
  </style>

  <rect width="1600" height="1000" fill="#151613"/>

  <g transform="translate(72 54)">
    <text class="label muted" x="0" y="18">APPROVED DIRECTION / 02</text>
    <text class="micro muted" x="1080" y="18">BLACK AS MATERIAL</text>
    <text class="micro" x="1456" y="18" text-anchor="end">VOICE → CARET</text>
    <line x1="0" y1="48" x2="1456" y2="48" stroke="#454641"/>
  </g>

  <g transform="translate(72 156)">
    <text x="0" y="176" font-size="184" font-weight="760" letter-spacing="-0.055em">SAID</text>
    <rect x="471" y="44" width="18" height="132" rx="9" fill="#F5F2E9"/>
    <text class="body muted" x="8" y="226">LOCAL VOICE. EXACT TEXT.</text>
    <text class="body-small muted" x="8" y="269">A statement: what was spoken is now exact text.</text>

    <g transform="translate(1144 0)">
      <rect x="0" y="0" width="312" height="312" rx="72" fill="#F5F2E9"/>
      <circle cx="76" cy="156" r="13" fill="#151613"/>
      <circle cx="126" cy="156" r="13" fill="#151613"/>
      <circle cx="170" cy="156" r="13" fill="#151613"/>
      <rect x="198" y="80" width="18" height="152" rx="9" fill="#151613"/>
      <text class="micro ink" x="156" y="280" text-anchor="middle">DOTS BECOME A CARET</text>
    </g>
  </g>

  <g transform="translate(72 505)">
    <text class="label muted" x="0" y="0">SIGNATURE SURFACE</text>

    <g transform="translate(0 34)">
      <rect x="0" y="0" width="680" height="110" rx="24" fill="#242522" stroke="#454641"/>
      <rect x="32" y="28" width="5" height="54" rx="2.5" fill="#F5F2E9"/>
      <rect x="45" y="41" width="5" height="28" rx="2.5" fill="#F5F2E9"/>
      <rect x="54" y="33" width="5" height="44" rx="2.5" fill="#F5F2E9"/>
      <rect x="71" y="23" width="5" height="64" rx="2.5" fill="#F5F2E9"/>
      <rect x="84" y="37" width="5" height="36" rx="2.5" fill="#F5F2E9"/>
      <line x1="117" y1="22" x2="117" y2="88" stroke="#454641"/>
      <text x="146" y="48" font-size="25" font-weight="650">Listening</text>
      <text class="body-small muted" x="146" y="78">Tap Right Alt to finish</text>
      <rect x="576" y="32" width="72" height="46" rx="8" fill="none" stroke="#454641"/>
      <text class="micro muted" x="612" y="61" text-anchor="middle">R ALT</text>
    </g>

    <g transform="translate(0 168)">
      <circle cx="34" cy="34" r="6" fill="#C5C3BA"/>
      <circle cx="58" cy="34" r="6" fill="#C5C3BA"/>
      <circle cx="82" cy="34" r="6" fill="#C5C3BA"/>
      <rect x="94" y="12" width="6" height="44" rx="3" fill="#F5F2E9"/>
      <text class="body-small muted" x="146" y="41">one motion, repeated everywhere</text>
    </g>

    <g transform="translate(760 -34)">
      <rect x="0" y="0" width="696" height="302" rx="18" fill="#F5F2E9"/>
      <g transform="translate(36 35)">
        <circle cx="8" cy="8" r="5" fill="#151613"/>
        <circle cx="25" cy="8" r="5" fill="#151613"/>
        <circle cx="42" cy="8" r="5" fill="#151613"/>
        <rect x="58" y="0" width="6" height="16" rx="3" fill="#151613"/>
        <text class="micro ink" x="88" y="14">SAID / SETUP</text>
        <text class="micro ink" x="610" y="14" text-anchor="end">1 — 3</text>

        <text class="ink" x="0" y="102" font-size="46" font-weight="720" letter-spacing="-0.035em">Say it once.</text>
        <text class="body-small ink" x="0" y="140">Your words land at the caret. On this PC.</text>

        <line x1="0" y1="179" x2="624" y2="179" stroke="#D1CEC5"/>
        <text class="micro ink" x="0" y="219">LOCAL</text>
        <text class="body-small ink" x="152" y="219">Nothing leaves your computer.</text>
        <rect x="504" y="191" width="120" height="50" rx="8" fill="#151613"/>
        <text class="micro paper" x="564" y="222" text-anchor="middle">CONTINUE</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 864)">
    <line x1="0" y1="0" x2="1456" y2="0" stroke="#454641"/>
    <text class="label muted" x="0" y="52">MONOCHROME SYSTEM</text>
    <circle cx="330" cy="44" r="14" fill="#F5F2E9"/>
    <text class="micro muted" x="356" y="50">BONE / PRIMARY MARK</text>
    <circle cx="670" cy="44" r="14" fill="#242522" stroke="#454641"/>
    <text class="micro muted" x="696" y="50">RAISED INK / OVERLAY</text>
    <circle cx="1074" cy="44" r="14" fill="#454641"/>
    <text class="micro muted" x="1100" y="50">HAIRLINE / STRUCTURE</text>
    <text class="micro muted" x="0" y="100">TERSE / TACTILE / EXACT</text>
    <text class="micro muted" x="1456" y="100" text-anchor="end">NO COLOR / NO GRADIENTS / NO GLOW</text>
  </g>
</svg>
